<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Let's Take 5</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Caveat:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="phone">
  <!-- ════ TOP LEFT GRAPHIC ════ -->
  <img id="left-graphic" src="graphics/microsite quiz cats2.png" alt="top left graphic" />

  <!-- ════ TOP RIGHT GRAPHIC ════ -->
  <img id="active-graphic" src="graphics/microsite quiz (1).png" alt="top right graphic" />

  

<!-- ════ TITLE ════ -->
<div class="title-wrap">
  <span class="title-line">Let's</span>
  <span class="title-line">Take</span>
</div>


<!-- ════ BIG 5 BUTTON ════ -->
<a class="btn-wrap" id="startBtn" href="start.html" onclick="goStart(event)" role="button" aria-label="Press to start">
  <div class="btn-inner">
  <svg class="oval-svg" width="220" height="180" viewBox="0 0 220 180" xmlns="http://www.w3.org/2000/svg">
    <!-- hand-drawn oval ring 1 -->
    <ellipse class="oval-ring" cx="110" cy="88" rx="88" ry="72"
      fill="#ddeef5" fill-opacity="0.55"
      stroke="#e86518" stroke-width="3.5"
      stroke-dasharray="12 5"
      stroke-linecap="round"
      transform="rotate(-4, 110, 88)"/>
    <!-- hand-drawn oval ring 2 (offset for sketch feel) -->
    <ellipse cx="112" cy="90" rx="84" ry="68"
      fill="none"
      stroke="#7a4e1e" stroke-width="2"
      stroke-dasharray="18 8 6 8"
      stroke-linecap="round"
      transform="rotate(3, 112, 90)"/>
    <!-- ripple placeholder -->
    <circle id="rippleEl" cx="110" cy="88" r="0" fill="none" stroke="#e86518" stroke-width="2" opacity="0"/>
  </svg>
  <!-- Pixel 5 overlaid -->
  <div class="pixel-5">5</div>
  <div class="press-label">Press to Start</div>
  </div>
</a>




  <!-- ════ BOTTOM RIGHT GRAPHIC ════ -->
  <img id="bottom-right-graphic" src="graphics/microsite quiz bigcat1.png" alt="bottom right graphic" />

</div><!-- /#phone -->

<script>
function goStart(e) {
  e.preventDefault();
  const btn = document.getElementById('startBtn');
  const ripple = document.getElementById('rippleEl');

  // animate ripple
  ripple.setAttribute('r', '10');
  ripple.setAttribute('opacity', '0.6');
  ripple.style.animation = 'none';
  void ripple.offsetWidth;
  ripple.style.animation = 'ripple 0.5s ease-out forwards';

  // brief delay then navigate
  setTimeout(() => {
    window.location.href = 'start.html';
  }, 400);
}
</script>

</body>
</html>
