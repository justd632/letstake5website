<!DOCTYPE html>

<body>

<div id="phone">

  <!-- ════ BUILDINGS ════ -->

    <div class="win-row"></div>
    <div class="win-row"></div>
    <div class="win-row"></div>

  </div>
</div>

<div class="building bld-rm">
  <div class="windows">
    <div class="win-row"></div>
    <div class="win-row"></div>
    <div class="win-row"></div>

</div>

<div class="building bld-bc">

<!-- ════ TITLE ════ -->
<div class="title-wrap">
  <span class="title-line">Let's</span>
  <span class="title-line">Take</span>
</div>


<!-- ════ BIG 5 BUTTON ════ -->
<a class="btn-wrap" id="startBtn" href="start.html" onclick="goStart(event)" role="button" aria-label="Press to start">
  <div class="btn-inner">
  <svg class="oval-svg" width="220" height="180" viewBox="0 0 220 180" xmlns="http://www.w3.org/2000/svg">
    <!-- hand-drawn oval ring 1 -->
    <ellipse class="oval-ring" cx="110" cy="88" rx="88" ry="72"
      fill="#ddeef5" fill-opacity="0.55"
      stroke="#e86518" stroke-width="3.5"
      stroke-dasharray="12 5"
      stroke-linecap="round"
      transform="rotate(-4, 110, 88)"/>
    <!-- hand-drawn oval ring 2 (offset for sketch feel) -->
    <ellipse cx="112" cy="90" rx="84" ry="68"
      fill="none"
      stroke="#7a4e1e" stroke-width="2"
      stroke-dasharray="18 8 6 8"
      stroke-linecap="round"
      transform="rotate(3, 112, 90)"/>
    <!-- ripple placeholder -->
    <circle id="rippleEl" cx="110" cy="88" r="0" fill="none" stroke="#e86518" stroke-width="2" opacity="0"/>
  </svg>
  <!-- Pixel 5 overlaid -->
  <div class="pixel-5">5</div>
  <div class="press-label">Press to Start</div>
  </div>
</a>


<!-- ════ FLOWERS ════ -->

    <line x1="130" y1="108" x2="130" y2="68" stroke="#7a9858" stroke-width="2"/>
    <line x1="175" y1="108" x2="175" y2="72" stroke="#7a9858" stroke-width="2"/>
    <line x1="220" y1="108" x2="220" y2="65" stroke="#7a9858" stroke-width="2"/>
    <line x1="265" y1="108" x2="265" y2="70" stroke="#7a9858" stroke-width="2"/>
    <line x1="310" y1="108" x2="310" y2="68" stroke="#7a9858" stroke-width="2"/>
    <!-- tulip flowers: blue-grey -->
    <ellipse cx="80" cy="65" rx="9" ry="13" fill="#8ab0c0" stroke="#6090a8" stroke-width="1.2"/>
    <ellipse cx="80" cy="58" rx="6" ry="9" fill="#6090a8"/>
    <ellipse cx="175" cy="67" rx="9" ry="13" fill="#8ab0c0" stroke="#6090a8" stroke-width="1.2"/>
    <ellipse cx="175" cy="60" rx="6" ry="9" fill="#6090a8"/>
    <ellipse cx="265" cy="65" rx="9" ry="13" fill="#8ab0c0" stroke="#6090a8" stroke-width="1.2"/>
    <ellipse cx="265" cy="58" rx="6" ry="9" fill="#6090a8"/>
    <!-- tulips: yellow -->
    <ellipse cx="130" cy="63" rx="9" ry="13" fill="#e8d870" stroke="#c0b040" stroke-width="1.2"/>
    <ellipse cx="130" cy="56" rx="6" ry="9" fill="#c8b840"/>
    <ellipse cx="220" cy="60" rx="9" ry="13" fill="#e8d870" stroke="#c0b040" stroke-width="1.2"/>
    <ellipse cx="220" cy="53" rx="6" ry="9" fill="#c8b840"/>
    <ellipse cx="310" cy="63" rx="9" ry="13" fill="#e8d870" stroke="#c0b040" stroke-width="1.2"/>
    <ellipse cx="310" cy="56" rx="6" ry="9" fill="#c8b840"/>
    <!-- leaves -->
    <path d="M 80 84 Q 68 78 72 70" stroke="#7a9858" stroke-width="1.8" fill="none"/>
    <path d="M 130 82 Q 142 76 138 68" stroke="#7a9858" stroke-width="1.8" fill="none"/>
    <path d="M 175 84 Q 163 78 167 70" stroke="#7a9858" stroke-width="1.8" fill="none"/>
    <path d="M 220 82 Q 232 76 228 68" stroke="#7a9858" stroke-width="1.8" fill="none"/>
    <path d="M 265 84 Q 253 78 257 70" stroke="#7a9858" stroke-width="1.8" fill="none"/>

</div>

  <!-- ════ BOTTOM RIGHT GRAPHIC ════ -->
  <img id="bottom-right-graphic" src="graphics/microsite quiz bigcat1.png" alt="bottom right graphic" />

</div><!-- /#phone -->

<script>
function goStart(e) {
  e.preventDefault();
  const btn = document.getElementById('startBtn');
  const ripple = document.getElementById('rippleEl');

  // animate ripple
  ripple.setAttribute('r', '10');
  ripple.setAttribute('opacity', '0.6');
  ripple.style.animation = 'none';
  void ripple.offsetWidth;
  ripple.style.animation = 'ripple 0.5s ease-out forwards';

  // brief delay then navigate
  setTimeout(() => {
    window.location.href = 'start.html';
  }, 400);
}
</script>

</body>
</html>
