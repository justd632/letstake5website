      <circle cx="73" cy="61" r="11" fill="#d0d0c0" stroke="#888870" stroke-width="1.5"/>
      <circle cx="43" cy="61" r="5"  fill="#555548"/>

<script>
/* ── Mosaic tile painter ── */
function drawMosaic(id, colors) {
  const c = document.getElementById(id);
  const ctx = c.getContext('2d');
  const tile = 44, gap = 5, step = tile + gap;
  const cols = Math.ceil(c.width  / step) + 1;
  const rows = Math.ceil(c.height / step) + 1;
  for (let r = 0; r < rows; r++) {
    for (let k = 0; k < cols; k++) {
      ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
      ctx.beginPath();
      ctx.roundRect(k * step, r * step, tile, tile, 3);
      ctx.fill();
    }
  }
}

drawMosaic('tilesTop', [
  '#a4c4d8','#8db4cc','#78a8c0','#94bece',
  '#b6d2e4','#66a0bc','#bdd4e4','#7eaecc','#5890b0','#c8dde8'
]);
drawMosaic('tilesBot', [
  '#d8a07a','#c88858','#e0b090','#c87848',
  '#d9a880','#b86840','#e8c0a0','#c09070','#b87858','#d4906a'
]);

/* ── Sparkle burst ── */
const STARS = ['✦','✧','⭐','★','✨','◆','♦'];
function spawnSparkles(btn) {
  const rect = btn.getBoundingClientRect();
  const phoneRect = document.getElementById('phone').getBoundingClientRect();
  for (let i = 0; i < 6; i++) {
    const s = document.createElement('div');
    s.className = 'sparkle';
    s.textContent = STARS[Math.floor(Math.random() * STARS.length)];
    const angle = (Math.PI * 2 / 6) * i + (Math.random() * 0.4);
    const dist = 55 + Math.random() * 30;
    const cx = (rect.left - phoneRect.left) + rect.width / 2;
    const cy = (rect.top  - phoneRect.top)  + rect.height / 2;
    s.style.left   = (cx + Math.cos(angle) * dist - 7) + 'px';
    s.style.top    = (cy + Math.sin(angle) * dist - 7) + 'px';
    s.style.color  = ['#e86518','#ffaa40','#ff6030','#ffd060','#7ac8e8'][Math.floor(Math.random()*5)];
    s.style.animationDelay = (i * 0.06) + 's';
    document.getElementById('phone').appendChild(s);
    setTimeout(() => s.remove(), 700);
  }
}

/* ── Button interactions ── */
function initBtn(id) {
  const el = document.getElementById(id);
  let sparkleTimer = null;

  el.addEventListener('mouseenter', () => {
    spawnSparkles(el);
    sparkleTimer = setInterval(() => spawnSparkles(el), 900);
  });
  el.addEventListener('mouseleave', () => {
    clearInterval(sparkleTimer);
  });

  el.addEventListener('click', function(e) {
    const href = el.getAttribute('href');
    if (!href || href === '#') {
      e.preventDefault();
    }
    clearInterval(sparkleTimer);
    el.classList.remove('bounce');
    void el.offsetWidth; // reflow
    el.classList.add('pressed');
    spawnSparkles(el);
    setTimeout(() => {
      el.classList.remove('pressed');
      el.classList.add('bounce');
    }, 200);
    setTimeout(() => el.classList.remove('bounce'), 650);
  });
}

initBtn('btnQuiz');
initBtn('btnLetter');
</script>
</body>
</html>
