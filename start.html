<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Let's Take 5 — Choose</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 100%;
  min-height: 100vh;
  background: #8aa8b8;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  font-family: 'Press Start 2P', monospace;
}

#phone {
  position: relative;
  width: 390px;
  height: 844px;
  overflow: hidden;
  flex-shrink: 0;
}

/* ── MOSAIC HALVES ── */
.half {
  position: absolute;
  left: 0;
  width: 390px;
}
.half-top  { top: 0;    height: 422px; }
.half-bottom { top: 422px; height: 422px; }

canvas {
  display: block;
  width: 390px;
  height: 100%;
}

/* ── KEYFRAMES ── */
@keyframes wiggle {
  0%,100% { transform: translateX(-50%) rotate(0deg) scale(1.06); }
  20%      { transform: translateX(-50%) rotate(-2.5deg) scale(1.07); }
  40%      { transform: translateX(-50%) rotate(2.5deg)  scale(1.08); }
  60%      { transform: translateX(-50%) rotate(-2deg)   scale(1.07); }
  80%      { transform: translateX(-50%) rotate(1.5deg)  scale(1.06); }
}
@keyframes borderSpin {
  to { stroke-dashoffset: -60; }
}
/* Idle float — gentler, indicates clickability */
@keyframes idleFloat {
  0%,100% { transform: translateX(-50%) translateY(0px); }
  50%      { transform: translateX(-50%) translateY(-8px); }
}
/* Hover float — faster + wider */
@keyframes floatUp {
  0%,100% { transform: translateX(-50%) translateY(-2px); }
  50%      { transform: translateX(-50%) translateY(-12px); }
}
@keyframes starPop {
  0%   { transform: scale(0) rotate(0deg); opacity: 0; }
  50%  { transform: scale(1.3) rotate(180deg); opacity: 1; }
  100% { transform: scale(1) rotate(360deg); opacity: 0; }
}
@keyframes textShimmer {
  0%,100% { letter-spacing: 0px;   color: #e86518; }
  50%      { letter-spacing: 1px;   color: #ff8030; }
}
@keyframes pressDown {
  0%   { transform: translateX(-50%) translateY(0); }
  40%  { transform: translateX(-50%) translateY(7px); }
  70%  { transform: translateX(-50%) translateY(3px); }
  100% { transform: translateX(-50%) translateY(6px); }
}
@keyframes bounceIn {
  0%   { transform: translateX(-50%) translateY(6px) scale(0.97); }
  50%  { transform: translateX(-50%) translateY(-4px) scale(1.04); }
  75%  { transform: translateX(-50%) translateY(1px) scale(1.01); }
  100% { transform: translateX(-50%) translateY(0px) scale(1); }
}

/* ── BUTTONS ── */
.choice-btn {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  width: 288px;
  padding: 24px 18px;
  background: #d8ecf5;
  border: 3px dotted #e86518;
  border-radius: 22px;
  box-shadow: 0 7px 0 #8a4820;
  cursor: pointer;
  text-align: center;
  transition: box-shadow 0.12s ease, background 0.2s ease;
  z-index: 10;
  text-decoration: none;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
  overflow: visible;
  /* idle float always on for enabled buttons */
  animation: idleFloat 2.6s ease-in-out infinite;
}

/* HOVER — faster float + wiggle once */
.choice-btn:hover {
  animation: floatUp 1.1s ease-in-out infinite, wiggle 0.5s ease 0.05s 1 forwards;
  background: #d8ecf5;
  box-shadow: 0 10px 0 #8a4820, 0 0 0 4px rgba(232,101,24,0.18);
}

/* ACTIVE / PRESSED */
.choice-btn:active,
.choice-btn.pressed {
  animation: pressDown 0.12s ease forwards;
  box-shadow: 0 1px 0 #8a4820;
  background: #d8ecf5;
}
.choice-btn.bounce {
  animation: bounceIn 0.45s cubic-bezier(.36,.07,.19,.97) forwards;
}

.choice-btn span {
  font-family: 'Press Start 2P', monospace;
  font-size: 15px;
  color: #e86518;
  line-height: 1.6;
  display: block;
  transition: color 0.2s;
}
.choice-btn:hover span {
  animation: textShimmer 0.8s ease-in-out infinite;
}

.btn-quiz   { top: 202px; }
.btn-letter { top: 590px; animation-delay: -1.3s; }

/* ── DISABLED (greyed out) ── */
.choice-btn.disabled {
  background: #c4c4c4;
  border-color: #888;
  box-shadow: 0 7px 0 #555;
  cursor: not-allowed;
  animation: none !important;
  transform: translateX(-50%);
}
.choice-btn.disabled:hover {
  background: #c4c4c4;
  box-shadow: 0 7px 0 #555;
  animation: none !important;
  transform: translateX(-50%);
}
.choice-btn.disabled span {
  color: #777;
  animation: none !important;
}

/* ── SPARKLE STARS (injected by JS) ── */
.sparkle {
  position: absolute;
  width: 14px; height: 14px;
  pointer-events: none;
  z-index: 20;
  animation: starPop 0.6s ease-out forwards;
  font-size: 14px;
  line-height: 1;
  user-select: none;
}

/* flash overlay */
.choice-btn::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 19px;
  background: rgba(232, 101, 24, 0.15);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}
.choice-btn.pressed::after { opacity: 1; }

/* ── DECORATIVE ── */
.deco { position: absolute; pointer-events: none; z-index: 12; }

.btn-overlay {
  position: absolute;
  top: -67px;
  right: -15px;
  width: 100px;
  height: auto;
  z-index: 2;
  pointer-events: none;
}
</style>
</head>
<body>
<div id="phone">

  <!-- TILE CANVASES -->
  <div class="half half-top">
    <canvas id="tilesTop" width="390" height="422"></canvas>
  </div>
  <div class="half half-bottom">
    <canvas id="tilesBot" width="390" height="422"></canvas>
  </div>

  <!-- ══ QUIZ BUTTON ══ -->
  <a class="choice-btn btn-quiz" href="quiz.html" id="btnQuiz">
    <img src="graphics/microsite quiz catwmedal1.png" alt="cat with medal" class="btn-overlay" />
    <span>Feeline Personality Quiz</span>
  </a>

  <!-- ══ LETTER BUTTON (disabled for now) ══ -->
  <a class="choice-btn btn-letter disabled" href="#" id="btnLetter" aria-disabled="true">
    <span>Reflection Letter</span>
  </a>

</div><!-- /#phone -->

<script>
/* ── Mosaic tile painter ── */
function drawMosaic(id, colors) {
  const c = document.getElementById(id);
  const ctx = c.getContext('2d');
  const tile = 44, gap = 5, step = tile + gap;
  const cols = Math.ceil(c.width  / step) + 1;
  const rows = Math.ceil(c.height / step) + 1;
  for (let r = 0; r < rows; r++) {
    for (let k = 0; k < cols; k++) {
      ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
      ctx.beginPath();
      ctx.roundRect(k * step, r * step, tile, tile, 3);
      ctx.fill();
    }
  }
}

drawMosaic('tilesTop', [
  '#a4c4d8','#8db4cc','#78a8c0','#94bece',
  '#b6d2e4','#66a0bc','#bdd4e4','#7eaecc','#5890b0','#c8dde8'
]);
drawMosaic('tilesBot', [
  '#d8a07a','#c88858','#e0b090','#c87848',
  '#d9a880','#b86840','#e8c0a0','#c09070','#b87858','#d4906a'
]);

/* ── Sparkle burst ── */
const STARS = ['✦','✧','⭐','★','✨','◆','♦'];
function spawnSparkles(btn) {
  const rect = btn.getBoundingClientRect();
  const phoneRect = document.getElementById('phone').getBoundingClientRect();
  for (let i = 0; i < 6; i++) {
    const s = document.createElement('div');
    s.className = 'sparkle';
    s.textContent = STARS[Math.floor(Math.random() * STARS.length)];
    const angle = (Math.PI * 2 / 6) * i + (Math.random() * 0.4);
    const dist = 55 + Math.random() * 30;
    const cx = (rect.left - phoneRect.left) + rect.width / 2;
    const cy = (rect.top  - phoneRect.top)  + rect.height / 2;
    s.style.left   = (cx + Math.cos(angle) * dist - 7) + 'px';
    s.style.top    = (cy + Math.sin(angle) * dist - 7) + 'px';
    s.style.color  = ['#e86518','#ffaa40','#ff6030','#ffd060','#7ac8e8'][Math.floor(Math.random()*5)];
    s.style.animationDelay = (i * 0.06) + 's';
    document.getElementById('phone').appendChild(s);
    setTimeout(() => s.remove(), 700);
  }
}

/* ── Button interactions ── */
function initBtn(id) {
  const el = document.getElementById(id);
  if (el.classList.contains('disabled')) {
    // Disabled buttons: block click, no hover effects, no sparkles
    el.addEventListener('click', e => e.preventDefault());
    return;
  }
  const href = el.getAttribute('href');
  let sparkleTimer = null;

  el.addEventListener('mouseenter', () => {
    spawnSparkles(el);
    sparkleTimer = setInterval(() => spawnSparkles(el), 900);
  });
  el.addEventListener('mouseleave', () => {
    clearInterval(sparkleTimer);
  });

  el.addEventListener('click', function(e) {
    if (!href || href === '#') {
      e.preventDefault();
    }
    clearInterval(sparkleTimer);
    el.classList.remove('bounce');
    void el.offsetWidth;
    el.classList.add('pressed');
    spawnSparkles(el);
  });
}

initBtn('btnQuiz');
initBtn('btnLetter');
</script>
</body>
</html>
